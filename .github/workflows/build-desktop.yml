name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar como GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python & Backend ─────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias Python + PyInstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend con PyInstaller
        working-directory: backend
        run: pyinstaller backend.spec --clean --noconfirm

      # ── Node & Frontend ──────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/app/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend/app
        run: npm ci

      - name: Build frontend (React)
        working-directory: frontend/app
        run: npm run build
        env:
          NODE_ENV: production

      # ── Electron ─────────────────────────────────────────────────────────────
      - name: Instalar dependencias Electron
        working-directory: electron
        run: npm ci

      - name: Build instalador Electron (sin publicar)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.publish != 'true' }}
        working-directory: electron
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build y publicar en GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true' }}
        working-directory: electron
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      # ── Artefacto de descarga en PRs / runs manuales ─────────────────────────
      - name: Upload instalador como artefacto
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: IMA-Marmol-installer-${{ github.sha }}
          path: electron/dist/*.exe
          retention-days: 7
