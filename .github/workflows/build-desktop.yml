name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar como GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python & Backend ─────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias Python + PyInstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # Caché del build de PyInstaller — se invalida si cambia algo del backend
      - name: Cache PyInstaller output
        id: cache-pyinstaller
        uses: actions/cache@v4
        with:
          path: backend/dist/backend
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('backend/requirements.txt', 'backend/backend.spec', 'backend/backend_main.py', 'backend/app/**/*.py') }}

      - name: Build backend con PyInstaller
        if: steps.cache-pyinstaller.outputs.cache-hit != 'true'
        working-directory: backend
        run: pyinstaller backend.spec --clean --noconfirm

      # ── Node & Frontend ──────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/app/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend/app
        run: npm ci

      # Caché del build de React — se invalida si cambia el código o dependencias
      - name: Cache frontend build
        id: cache-frontend
        uses: actions/cache@v4
        with:
          path: frontend/app/build
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/app/package-lock.json', 'frontend/app/src/**', 'frontend/app/index.html', 'frontend/app/vite.config.ts') }}

      - name: Build frontend (React)
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        working-directory: frontend/app
        run: npm run build
        env:
          NODE_ENV: production

      # ── Electron ─────────────────────────────────────────────────────────────
      - name: Cache Electron node_modules
        uses: actions/cache@v4
        with:
          path: electron/node_modules
          key: electron-node-${{ runner.os }}-${{ hashFiles('electron/package-lock.json') }}

      - name: Instalar dependencias Electron
        working-directory: electron
        run: npm ci

      - name: Build instalador Electron (sin publicar)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.publish != 'true' }}
        working-directory: electron
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build y publicar en GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true' }}
        working-directory: electron
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      # ── Artefacto de descarga en runs manuales ───────────────────────────────
      - name: Upload instalador como artefacto
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: marmoles-taup-installer-${{ github.sha }}
          path: electron/dist/*.exe
          retention-days: 7
