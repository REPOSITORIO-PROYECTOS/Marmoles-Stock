name: dimarmi

services:
  db:
    image: postgres:15-alpine
    container_name: dimarmi_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '-E UTF8'
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - dimarmi_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dimarmi_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@dimarmi_db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: 1
      ENABLE_COMMERCIAL_MODULES: ${ENABLE_COMMERCIAL_MODULES:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - default
      - cerebro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dimarmi_frontend
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - default
      - cerebro

volumes:
  dimarmi_pgdata:
    external: true
    name: dimarmi_postgres_data

networks:
  default:
    driver: bridge
  cerebro:
    external: true
    name: cerebro_default
