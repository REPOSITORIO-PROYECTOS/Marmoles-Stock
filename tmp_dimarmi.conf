server {
    listen 80;
    server_name dimarmi.sistemataup.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dimarmi.sistemataup.online;

    ssl_certificate /etc/letsencrypt/live/dimarmi.sistemataup.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dimarmi.sistemataup.online/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 50m;

    location / {
        set $dimarmi_frontend_upstream http://dimarmi_frontend:80;
        proxy_pass $dimarmi_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        set $dimarmi_backend_upstream http://dimarmi_backend:8000;
        proxy_pass $dimarmi_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /docs {
        set $dimarmi_backend_upstream http://dimarmi_backend:8000;
        proxy_pass $dimarmi_backend_upstream;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $dimarmi_backend_upstream http://dimarmi_backend:8000;
        proxy_pass $dimarmi_backend_upstream;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        set $dimarmi_backend_upstream http://dimarmi_backend:8000;
        proxy_pass $dimarmi_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        set $dimarmi_backend_upstream http://dimarmi_backend:8000;
        proxy_pass $dimarmi_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $dimarmi_backend_upstream http://dimarmi_backend:8000;
        proxy_pass $dimarmi_backend_upstream/health;
        proxy_set_header Host $host;
    }
}
